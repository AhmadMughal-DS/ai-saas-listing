name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  IMAGE_NAME: ahmad928/ai-saas-listing

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build Docker image & push to DockerHub
  # ──────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}

  # ──────────────────────────────────────────────
  # Job 2: Deploy to Oracle VM via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            set -e

            IMAGE="ahmad928/ai-saas-listing:latest"
            CONTAINER_NAME="ai-saas-listing"

            echo "🔄 Pulling latest image..."
            docker pull $IMAGE

            echo "🛑 Stopping old container (if running)..."
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p 3000:3000 \
              -e DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e FIREBASE_SERVICE_ACCOUNT="${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" \
              -e NODE_ENV=production \
              $IMAGE

            echo "🧹 Cleaning up dangling images..."
            docker image prune -f

            echo "✅ Deployment complete!"
            docker ps --filter name=$CONTAINER_NAME
