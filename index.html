<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Google AdSense ───────────────────────────────────── -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7619883861807750"
      crossorigin="anonymous"></script>

    <!-- ── Primary SEO ──────────────────────────────────────── -->
    <title>ToolverAI — Discover, Compare & Track the Best AI Tools (2026)</title>
    <meta name="description" content="ToolverAI is the leading AI tools directory. Discover 1000+ AI tools, compare features & pricing, track monthly traffic rankings, find verified deals, and explore the AI prompt library." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Canonical is injected per-route by the SSR layer (renderSsrPage). No hard-coded
         homepage canonical here, so a non-SSR fallback never mislabels a deep page. -->

    <!-- ── Keyword & Author ──────────────────────────────────── -->
    <meta name="keywords" content="AI tools directory, best AI tools 2026, compare AI tools, AI tools ranking, AI deals, AI prompts, ChatGPT alternatives, Claude alternatives, AI software" />
    <meta name="author" content="ToolverAI" />
    <meta name="copyright" content="ToolverAI" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="3 days" />


    <!-- ── Open Graph (Social Sharing) ──────────────────────── -->
    <meta property="og:site_name" content="ToolverAI" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://toolverai.com/" />
    <meta property="og:title" content="ToolverAI — Discover, Compare & Track the Best AI Tools (2026)" />
    <meta property="og:description" content="The leading AI tools directory. Compare 1000+ AI tools by traffic, pricing & features. Find verified deals and the best AI tools for every use case." />
    <meta property="og:image" content="https://toolverai.com/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ToolverAI — AI Tools Directory, Rankings & Deals" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter / X Card ─────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@toolverai" />
    <meta name="twitter:creator" content="@toolverai" />
    <meta name="twitter:title" content="ToolverAI — Discover, Compare & Track the Best AI Tools (2026)" />
    <meta name="twitter:description" content="The leading AI tools directory. Compare 1000+ AI tools by traffic, pricing & features. Find verified deals and the best AI tools for every use case." />
    <meta name="twitter:image" content="https://toolverai.com/og-banner.png" />
    <meta name="twitter:image:alt" content="ToolverAI — AI Tools Directory" />

    <!-- ── Favicon / PWA (real crawlable files — required for Google SERP icon) ── -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="application-name" content="ToolverAI" />
    <meta name="apple-mobile-web-app-title" content="ToolverAI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Preconnect for Performance ────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />

    <!-- ── Fonts (CSP-safe async load — no onload attr, no unsafe-inline) ── -->
    <!-- Preload hint so browser can discover the stylesheet early            -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <!-- Injected by GA4 init script block below; noscript fallback here: -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- ── Google Analytics 4 (GA4) + Async Font Loader ──────── -->
    <!-- Loads only if VITE_GA4_MEASUREMENT_ID is set in .env   -->
    <!-- send_page_view: false — React fires page_view manually  -->
    <!-- via src/lib/analytics.ts to avoid SPA duplicate hits.   -->
    <!-- Font loader uses createElement — CSP-safe, no onload    -->
    <script>
      (function() {
        // ── Async font injection (CSP-safe, no inline event attribute) ──
        var fontHref = 'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap';
        var fontLink = document.createElement('link');
        fontLink.rel = 'stylesheet';
        fontLink.href = fontHref;
        document.head.appendChild(fontLink);

        // ── GA4 ──
        var gid = '%VITE_GA4_MEASUREMENT_ID%';
        if (!gid || gid === '%VITE_GA4_MEASUREMENT_ID%' || !gid.startsWith('G-')) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + gid;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', gid, {
          send_page_view: false,
          cookie_flags: 'SameSite=None;Secure'
        });
      })();
    </script>

    <!-- ── Homepage JSON-LD Structured Data ──────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://toolverai.com/#organization",
          "name": "ToolverAI",
          "url": "https://toolverai.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://toolverai.com/og-banner.png",
            "width": 1200,
            "height": 630
          },
          "description": "ToolverAI is the leading AI tools discovery platform, providing rankings, comparisons, curated deals, and reviews for AI software.",
          "sameAs": [
            "https://x.com/toolverai"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://toolverai.com/#website",
          "url": "https://toolverai.com",
          "name": "ToolverAI",
          "description": "Discover, compare and track the best AI tools. Estimated traffic data, curated deals, and expert reviews.",
          "publisher": { "@id": "https://toolverai.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://toolverai.com/?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- ── Theme Flash Prevention & Initial Theme Setup ──────────────── -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('toolver_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--color-bg-base,#F8FAFC)] text-[var(--color-text-main,#0F172A)] antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden">
    <!-- ── Branded boot splash: paints instantly with inline styles and covers the ──
         ── crawler-only SSR markup inside #root until React renders the styled app, ──
         ── eliminating the flash of unstyled text on first load.                     -->
    <style>
      @keyframes tv-spin { to { transform: rotate(360deg); } }
      #app-splash { position: fixed; inset: 0; z-index: 2147483647; display: flex;
        align-items: center; justify-content: center;
        background: #F8FAFC; transition: opacity .35s ease; }
      html.dark #app-splash, html[data-theme="dark"] #app-splash { background: #090d16; }
      #app-splash.tv-hide { opacity: 0; pointer-events: none; }
      #app-splash .tv-mark { width: 60px; height: 60px; border-radius: 15px;
        box-shadow: 0 12px 34px -10px rgba(79,70,229,.5); }
      #app-splash .tv-spin { margin-top: 20px; width: 30px; height: 30px;
        border: 3px solid rgba(100,116,139,.25); border-top-color: #4F46E5;
        border-radius: 50%; animation: tv-spin .7s linear infinite; }
    </style>
    <div id="app-splash" aria-hidden="true">
      <div style="display:flex;flex-direction:column;align-items:center;">
        <img class="tv-mark" src="/favicon.svg" width="60" height="60" alt="ToolverAI" />
        <div class="tv-spin"></div>
      </div>
    </div>
    <script>
      /* Safety net: never let the splash trap the user if the bundle fails to load. */
      setTimeout(function () {
        var s = document.getElementById('app-splash');
        if (s) { s.classList.add('tv-hide'); setTimeout(function () { if (s.parentNode) s.remove(); }, 400); }
      }, 10000);
    </script>

    <!-- ── Accessible No-JS Fallback ─────────────────────────── -->
    <noscript>
      <div style="padding:20px;text-align:center;font-family:sans-serif;">
        <strong>ToolverAI</strong> requires JavaScript to run. Please enable JavaScript in your browser settings.
        <br />Visit <a href="https://toolverai.com">toolverai.com</a> to discover and compare the best AI tools.
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
