    <!-- ── Google Analytics 4 (GA4) ─────────────────────────── -->
    <!-- Loads only if VITE_GA4_MEASUREMENT_ID is set in .env   -->
    <!-- send_page_view: false — React fires page_view manually  -->
    <!-- via src/lib/analytics.ts to avoid SPA duplicate hits.   -->
    <script>
      (function() {
        var gid = '%VITE_GA4_MEASUREMENT_ID%';
        if (!gid || gid === '%VITE_GA4_MEASUREMENT_ID%' || !gid.startsWith('G-')) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + gid;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', gid, {
          send_page_view: false,
          cookie_flags: 'SameSite=None;Secure'
        });
      })();
    </script>

    <!-- ── Light Theme Default & Theme Flash Prevention ──────────────── -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('toolver_theme');
          // Default for all new visitors is Light theme. Only switch to dark if explicitly chosen.
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
